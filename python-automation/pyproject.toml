[project]
name = "python-automation"
version = "0.1.0"
description = "Python BDD acceptance tests (behave) — mirrors java/kotlin/typescript automation suites"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "behave>=1.3.3",
    "playwright>=1.50.0",
    "selenium>=4.27.0",
    "httpx>=0.28.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
    "mypy>=1.18.1",
    "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true
